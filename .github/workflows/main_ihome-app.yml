# ═══════════════════════════════════════════════════════════════════
#  Publicação da API no Azure App Service
#
#  Destino: ihome-api-2026 (plano Gratuito F1, grupo de recursos Ihome).
#
#  Por que publish profile e não login com az: o perfil de publicação é
#  um XML com credencial própria do App Service, guardado como secret.
#  Não dá acesso ao resto da assinatura — se vazar, o estrago fica
#  contido neste recurso.
#
#  ⚠️ O plano F1 não tem "Always On": o site hiberna após ~20 minutos
#  sem requisição e demora alguns segundos para acordar. Antes de uma
#  demonstração, abra a URL uma vez para tirá-lo do sono.
# ═══════════════════════════════════════════════════════════════════

name: Build and deploy Node.js app to Azure Web App - ihome-api-2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # necessário para o actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          # Nome do App Service recriado em 19/10/2026, depois de o anterior
          # (ihome-app, plano Premium) ser excluído na contenção de custo.
          app-name: 'ihome-api-2026'
          slot-name: 'Production'
          package: .
          # Secret com o XML baixado em: App Service → Visão geral →
          # "Baixar perfil de publicação". Nome genérico de propósito: o
          # anterior trazia um GUID colado ao recurso antigo, e ninguém
          # conseguia dizer, olhando, a qual app ele pertencia.
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
