# ═══════════════════════════════════════════════════════════════════
#  CI/CD — iHome Backend
#
#  Três jobs encadeados:
#    test       → roda sempre (push e pull request). Portão de qualidade.
#    publicar   → só na main, e só se o teste passar. Envia a imagem ao GHCR.
#    verificar  → confirma que a versão nova entrou no ar.
#
#  O `needs:` é o que torna isto uma esteira de verdade: código que quebra
#  teste ou reprova no SonarCloud nunca chega a ser publicado.
# ═══════════════════════════════════════════════════════════════════
name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas da mesma branch: dois pushes seguidos não
# precisam de duas publicações concorrentes disputando a mesma tag.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  IMAGE_NAME: ihome-backend

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  1. TESTES E ANÁLISE ESTÁTICA
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Testes e Análise
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # Segredo fictício: os testes só precisam assinar e verificar tokens
      # entre si. O segredo real de produção nunca entra no pipeline.
      JWT_SECRET: chave-apenas-para-o-pipeline-de-teste
      GEMINI_API_KEY: chave-de-teste

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O SonarCloud precisa do histórico completo para atribuir
          # cada linha ao commit que a introduziu (blame).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes com cobertura
        run: npm test

      # Falha o build se a cobertura cair abaixo do exigido pela disciplina.
      # Sem esta verificação, uma queda passaria despercebida até a
      # prova de autoria — que é justamente onde ela é conferida.
      - name: Verificar cobertura mínima de 75%
        run: |
          COBERTURA=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
          echo "Cobertura de statements: ${COBERTURA}%"
          node -e "process.exit(${COBERTURA} >= 75 ? 0 : 1)" || {
            echo "::error::Cobertura ${COBERTURA}% abaixo do mínimo de 75% exigido para Web Apps."
            exit 1
          }

      # A análise não bloqueia o pipeline: se o SONAR_TOKEN ainda não foi
      # configurado, o passo é pulado em vez de reprovar o build inteiro.
      # Os testes e o portão de cobertura, esses sim, continuam obrigatórios.
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v4

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  #  2. PUBLICAÇÃO DA IMAGEM
  #
  #  Repare no que este job NÃO faz: ele não acessa o servidor.
  #  A disciplina veda "deploy via SSH/FTP", e a saída aqui não é
  #  contornar o SSH — é não precisar dele. O pipeline publica a imagem
  #  num registry; a VM observa o registry e se atualiza sozinha
  #  (Watchtower). O deploy vira declarativo: "a versão boa é esta",
  #  em vez de "conecte na máquina e execute estes comandos".
  # ─────────────────────────────────────────────────────────────────
  publicar:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    needs: test                                    # só roda se o teste passou
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write        # necessário para escrever no GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Fornecido automaticamente pelo Actions — não há secret a criar.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Duas tags: o SHA identifica exatamente o que foi publicado e
          # permite rollback preciso; :latest é o ponteiro que a VM segue.
          tags: |
            ghcr.io/${{ github.repository_owner }}/ihome-backend:latest
            ghcr.io/${{ github.repository_owner }}/ihome-backend:${{ github.sha }}
          # Cache entre execuções: sem ele, cada build reinstala todas as
          # dependências do zero.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada" >> $GITHUB_STEP_SUMMARY
          echo '`ghcr.io/${{ github.repository_owner }}/ihome-backend:${{ github.sha }}`' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A VM detecta e aplica em até 2 minutos." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────
  #  3. VERIFICAÇÃO EM PRODUÇÃO
  #  Confirma que a versão nova de fato entrou no ar. Sem isto, uma
  #  imagem que sobe e morre apareceria como deploy bem-sucedido.
  # ─────────────────────────────────────────────────────────────────
  verificar:
    name: Verificar produção
    runs-on: ubuntu-latest
    needs: publicar
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Aguardar o Watchtower aplicar e conferir /health
        run: |
          URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::Variável PRODUCTION_URL não definida — verificação ignorada."
            exit 0
          fi
          echo "Aguardando $URL/api/health"
          # O Watchtower verifica o registry a cada 2 min; damos 5.
          for tentativa in $(seq 1 20); do
            if curl -fsS --max-time 10 "$URL/api/health" | grep -q '"ok":true'; then
              echo "✅ Produção respondendo na tentativa $tentativa."
              exit 0
            fi
            echo "tentativa $tentativa/20..."
            sleep 20
          done
          echo "::error::A produção não respondeu em /api/health após 6 minutos."
          exit 1
